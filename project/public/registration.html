<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на подію</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --error: #ef4444;
            --ok: #22c55e;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(100%, 560px);
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .meta {
            color: var(--muted);
            margin-bottom: 18px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 120px;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: #0b1220;
            color: var(--text);
            outline: none;
            resize: vertical;
        }

        textarea::placeholder { color: var(--muted); }
        textarea.error { border-color: var(--error); }
        textarea.valid { border-color: var(--ok); }
        .field-error { display: block; min-height: 18px; color: #fca5a5; font-size: 12px; margin-top: 6px; }
        #submitBtn {
            width: 100%;
            padding: 12px 14px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #00111b;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }
        #serverErrors { margin-bottom: 16px; }
        #serverErrors p { color: #fca5a5; margin: 6px 0; }
        a { color: #7dd3fc; }
        .field { margin-bottom: 16px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Реєстрація на подію</h1>
        <p id="eventInfo" class="meta"></p>
        <div id="serverErrors"></div>

        <form id="registrationForm" novalidate>
            <div class="field">
                <textarea id="note" placeholder="Примітка до реєстрації (необов'язково, максимум 500 символів)"></textarea>
                <span class="field-error" id="noteError"></span>
            </div>

            <button type="submit" id="submitBtn">Зареєструватися</button>
        </form>

        <p><a href="/index.html">Назад до списку</a></p>
    </main>

    <script>
        const API_URL = 'http://localhost:3000';
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('eventId');
        const noteInput = document.getElementById('note');
        const submitBtn = document.getElementById('submitBtn');
        const eventInfo = document.getElementById('eventInfo');

        if (!eventId) {
            window.location.href = '/index.html';
        } else {
            eventInfo.textContent = `Реєстрація для події ID: ${eventId}`;
        }

        function setError(message) {
            noteInput.classList.add('error');
            noteInput.classList.remove('valid');
            document.getElementById('noteError').textContent = message;
        }

        function setValid() {
            noteInput.classList.remove('error');
            noteInput.classList.add('valid');
            document.getElementById('noteError').textContent = '';
        }

        function validateNote() {
            if (noteInput.value.length > 500) {
                setError('Максимум 500 символів');
                submitBtn.disabled = true;
                return false;
            }

            setValid();
            submitBtn.disabled = false;
            return true;
        }

        noteInput.addEventListener('input', validateNote);
        noteInput.addEventListener('blur', validateNote);

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('serverErrors').innerHTML = '';

            if (!validateNote()) {
                return;
            }

            const response = await fetch(`${API_URL}/api/events/${eventId}/registrations`, {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    note: noteInput.value.trim()
                })
            });

            const data = await response.json();

            if (!response.ok) {
                const container = document.getElementById('serverErrors');
                const msgs = data.errors || [data.message];
                container.innerHTML = msgs.map((message) => `<p>${message}</p>`).join('');
                return;
            }

            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
